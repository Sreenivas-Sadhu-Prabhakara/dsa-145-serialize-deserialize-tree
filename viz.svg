<text x="56.0" y="398.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Round-trip is exact for ANY shape — no inorder needed because the #s encode the</text>
<text x="56.0" y="417.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">structure. This is how trees cross process boundaries; the format is the invariant,</text>
<text x="56.0" y="436.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">the code is replay.</text>
<text x="72.0" y="471.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">contract</text>
