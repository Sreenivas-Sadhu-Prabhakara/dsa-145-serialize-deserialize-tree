<text x="56.0" y="261.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Serialize: "1 2 # # #" — node, left subtree, right subtree, holes included.</text>
<text x="56.0" y="280.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Deserialize replays the same preorder: consume one token, recurse left, recurse</text>
<text x="56.0" y="299.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">right; a # returns nil immediately.</text>
<text x="84.0" y="348.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#64748b" text-anchor="end">stream</text>
